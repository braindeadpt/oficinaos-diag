name: ci

# O projeto de testes é net8.0 puro (liga os ficheiros sem UI) — corre em
# Linux, não precisa do runner Windows nem das platform-tools.
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test tests/OficinaDiag.Tests -c Release

  # A app é WPF (net8.0-windows), mas compila em Linux com o targeting pack:
  # apanha XAML/using partidos sem gastar minutos de runner Windows.
  build-wpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Build WPF app
        run: dotnet build src/OficinaDiag/OficinaDiag.csproj -c Release -p:EnableWindowsTargeting=true

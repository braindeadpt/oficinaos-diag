name: ci

# Suite + WPF nos dois sistemas que interessam: Linux prova que o Core é
# portátil; Windows prova o que depende da plataforma — o kill de árvore usa
# Job Objects, não o kill em grupo do Unix, e o targeting pack é nativo.
# `EnableWindowsTargeting` só é preciso em Linux e é inócuo no Windows, por
# isso o mesmo par de passos serve a matriz toda, sem jobs repetidos.
on:
  push:
    branches: ["main"]
  pull_request:
  # Manual, para investigar falhas que só aparecem de vez em quando: com
  # `stress` a matriz repete os testes de árvore de processos 10x e o log da
  # primeira falha traz o diagnóstico do lançador (started/pid/erro).
  workflow_dispatch:
    inputs:
      stress:
        description: "Repetir os testes de árvore de processos 10x"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # um sistema a falhar não esconde o resultado do outro
      matrix:
        # Versões fixas, não `-latest`: o `ubuntu-latest` migra para Ubuntu 26
        # (anúncio do runner-images #14748) e um ambiente novo não pode entrar
        # sem se ver a matriz. Subir de versão passa a ser um commit.
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test tests/OficinaDiag.Tests -c Release

      - name: Stress tree-kill tests
        if: inputs.stress
        shell: pwsh
        run: |
          foreach ($i in 1..10) {
            Write-Host "=== iteração $i ==="
            dotnet test tests/OficinaDiag.Tests -c Release --filter "FullyQualifiedName~ToolProcessTests"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # O cenário que o `DiagConfigTests` não aguentava: duas suites completas
      # no mesmo checkout, ao mesmo tempo. `--no-build` porque o passo `Test`
      # já deixou o binário pronto — dois MSBuild no mesmo obj seria outra corrida.
      - name: Duas suites em paralelo
        if: inputs.stress
        shell: pwsh
        run: |
          $a = Start-Process dotnet -ArgumentList 'test','tests/OficinaDiag.Tests','-c','Release','--no-build' -NoNewWindow -PassThru -RedirectStandardOutput a.log
          $b = Start-Process dotnet -ArgumentList 'test','tests/OficinaDiag.Tests','-c','Release','--no-build' -NoNewWindow -PassThru -RedirectStandardOutput b.log
          $a.WaitForExit(); $b.WaitForExit()
          Get-Content a.log | Select-String -Pattern 'Passed!|Failed!' | ForEach-Object { "A: $_" }
          Get-Content b.log | Select-String -Pattern 'Passed!|Failed!' | ForEach-Object { "B: $_" }
          if ($a.ExitCode -ne 0 -or $b.ExitCode -ne 0) { exit 1 }

      - name: Build WPF app
        run: dotnet build src/OficinaDiag/OficinaDiag.csproj -c Release -p:EnableWindowsTargeting=true

      # O plano tem de continuar verificável: placar a bater com os tickets,
      # [x] com prova, [ ] com motivo, e nenhum teste citado que já não exista.
      - name: Plan criteria
        if: runner.os == 'Linux'
        run: node tools/plan-check.mjs

      # Corre nos dois braços: o harness já é EOL-agnóstico (a regressão do
      # CRLF que o PR #11 corrigiu só aparecia no Windows), e correr lá é o que
      # impede o `autocrlf` de voltar a esconder um problema.
      - name: JS decisions (jsdom)
        run: |
          npm ci --prefix tests/device-test --no-audit --no-fund
          node --test tests/device-test/device-test.test.mjs

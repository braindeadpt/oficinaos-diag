name: ci

# Suite + WPF nos dois sistemas que interessam: Linux prova que o Core é
# portátil; Windows prova o que depende da plataforma — o kill de árvore usa
# Job Objects, não o kill em grupo do Unix, e o targeting pack é nativo.
# `EnableWindowsTargeting` só é preciso em Linux e é inócuo no Windows, por
# isso o mesmo par de passos serve a matriz toda, sem jobs repetidos.
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # um sistema a falhar não esconde o resultado do outro
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test tests/OficinaDiag.Tests -c Release

      - name: Build WPF app
        run: dotnet build src/OficinaDiag/OficinaDiag.csproj -c Release -p:EnableWindowsTargeting=true

      # As decisões da página on-device não dependem do sistema: correm uma vez.
      - name: JS decisions (jsdom)
        if: runner.os == 'Linux'
        run: |
          npm ci --prefix tests/device-test --no-audit --no-fund
          node --test tests/device-test/device-test.test.mjs

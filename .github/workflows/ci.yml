name: ci

# Suite + WPF nos dois sistemas que interessam: Linux prova que o Core é
# portátil; Windows prova o que depende da plataforma — o kill de árvore usa
# Job Objects, não o kill em grupo do Unix, e o targeting pack é nativo.
# `EnableWindowsTargeting` só é preciso em Linux e é inócuo no Windows, por
# isso o mesmo par de passos serve a matriz toda, sem jobs repetidos.
on:
  push:
    branches: ["main"]
  pull_request:
  # Manual, para investigar falhas que só aparecem de vez em quando: com
  # `stress` a matriz repete os testes de árvore de processos 10x e o log da
  # primeira falha traz o diagnóstico do lançador (started/pid/erro).
  workflow_dispatch:
    inputs:
      stress:
        description: "Repetir os testes de árvore de processos 10x"
        type: boolean
        default: false
      mutantes_ui:
        description: "Provar os 15 mutantes de UI no Windows (~45 min)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # um sistema a falhar não esconde o resultado do outro
      matrix:
        # Versões fixas, não `-latest`: o `ubuntu-latest` migra para Ubuntu 26
        # (anúncio do runner-images #14748) e um ambiente novo não pode entrar
        # sem se ver a matriz. Subir de versão passa a ser um commit.
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test tests/OficinaDiag.Tests -c Release

      - name: Mutation check (a suite morde onde diz morder?)
        # A regra «provado por mutação» deixa de depender de alguém se lembrar:
        # `--seco` confirma que os seis mutantes ainda aplicam (os da UI também,
        # que só correm num Windows) e a segunda chamada exige mesmo vermelho nos
        # que `dotnet test` cobre. Numa só máquina chega: o teste é de suite.
        if: runner.os == 'Linux'
        run: |
          node tools/mutation-check.mjs --seco
          node tools/mutation-check.mjs

      - name: Stress tree-kill tests
        if: inputs.stress
        shell: pwsh
        run: |
          foreach ($i in 1..10) {
            Write-Host "=== iteração $i ==="
            dotnet test tests/OficinaDiag.Tests -c Release --filter "FullyQualifiedName~ToolProcessTests"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # O cenário que o `DiagConfigTests` não aguentava: duas suites completas
      # no mesmo checkout, ao mesmo tempo. `--no-build` porque o passo `Test`
      # já deixou o binário pronto — dois MSBuild no mesmo obj seria outra corrida.
      - name: Duas suites em paralelo
        if: inputs.stress
        shell: pwsh
        run: |
          $a = Start-Process dotnet -ArgumentList 'test','tests/OficinaDiag.Tests','-c','Release','--no-build' -NoNewWindow -PassThru -RedirectStandardOutput a.log
          $b = Start-Process dotnet -ArgumentList 'test','tests/OficinaDiag.Tests','-c','Release','--no-build' -NoNewWindow -PassThru -RedirectStandardOutput b.log
          $a.WaitForExit(); $b.WaitForExit()
          Get-Content a.log | Select-String -Pattern 'Passed!|Failed!' | ForEach-Object { "A: $_" }
          Get-Content b.log | Select-String -Pattern 'Passed!|Failed!' | ForEach-Object { "B: $_" }
          if ($a.ExitCode -ne 0 -or $b.ExitCode -ne 0) { exit 1 }

      - name: Build WPF app
        run: dotnet build src/OficinaDiag/OficinaDiag.csproj -c Release -p:EnableWindowsTargeting=true

      # O plano tem de continuar verificável: placar a bater com os tickets,
      # [x] com prova, [ ] com motivo, e nenhum teste citado que já não exista.
      - name: Plan criteria
        if: runner.os == 'Linux'
        run: node tools/plan-check.mjs

      # Depois do plano: se as capturas falharem, o plano já está verificado e
      # o erro do render fica isolado. `always()` publica o que existir mesmo
      # com um passo anterior vermelho — uma imagem a menos é melhor que zero.
      - name: Capturas da UI (3 temas + combo por teclado)
        if: runner.os == 'Windows'
        run: dotnet run --project tools/UiShots/UiShots.csproj -c Release -- out-store/ui-shots

      # O harness diz `[OK]` a cada verificação que corre; este passo compara
      # isso com as que o código **declara**. Uma prova que deixa de correr
      # (um `return` novo, um `try` que a engole) continua a ter todos os
      # `[OK]` verdes no log — simplesmente não tem este, e até aqui ninguém
      # dava por isso.
      - name: Provas declaradas vs provas corridas
        if: runner.os == 'Windows' && always()
        run: node tools/proofs-check.mjs out-store/ui-shots/provas.txt

      - name: Publicar capturas
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: out-store/ui-shots
          if-no-files-found: warn

      # Corre nos dois braços: o harness já é EOL-agnóstico (a regressão do
      # CRLF que o PR #11 corrigiu só aparecia no Windows), e correr lá é o que
      # impede o `autocrlf` de voltar a esconder um problema.
      - name: JS decisions (jsdom)
        run: |
          npm ci --prefix tests/device-test --no-audit --no-fund
          node --test tests/device-test/device-test.test.mjs

  # Os mutantes de UI provavam-se à mão, com sonda em `main` e revert — caro,
  # e por isso feito cada vez menos. Este job corre-os a pedido: aplica cada
  # defeito, exige vermelho com a verificação declarada e repõe o ficheiro.
  # Fica fora do push porque cada mutante é uma compilação do harness mais uma
  # execução completa dele (~45 min no total).
  mutantes-ui:
    if: github.event_name == 'workflow_dispatch' && inputs.mutantes_ui
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      # `--uishots` acrescenta os 15 da UI aos 4 de suite; a janela só existe
      # no Windows e o script recusa correr os de UI noutro sistema.
      - name: Mutantes de UI (o harness morde onde diz morder?)
        run: node tools/mutation-check.mjs --uishots

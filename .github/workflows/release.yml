name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Fetch bundled tools (adb platform-tools)
        shell: pwsh
        run: ./tools/fetch-tools.ps1

      - name: Test
        # A release não sai sem os testes verdes — enviar binários sem os
        # correr era um acidente à espera de acontecer.
        run: dotnet test tests/OficinaDiag.Tests -c Release

      - name: Publish single-file exe
        # The tag IS the version — embed it so the exe's self-update check
        # can never disagree with the release it's running.
        run: >-
          dotnet publish src/OficinaDiag/OficinaDiag.csproj
          -c Release -r win-x64 --self-contained true
          /p:PublishSingleFile=true
          /p:Version=$($env:VERSION.TrimStart('v')) -o out
        env:
          VERSION: ${{ github.ref_name }}

      - name: Package
        shell: pwsh
        # O nome do zip leva a versão — fica pinned no SHA256SUMS e o updater
        # valida-a contra o tag (anti-downgrade: um SUMS antigo republicado
        # num tag mais alto é recusado).
        run: >-
          Compress-Archive -Path out/*
          -DestinationPath "oficinaos-diag-v$($env:VERSION.TrimStart('v'))-win-x64.zip"
        env:
          VERSION: ${{ github.ref_name }}

      - name: Verify package contains adb
        shell: pwsh
        # O zip é o que o cliente recebe: sem tools/platform-tools o diag fica
        # sem adb e o teste on-device não arranca. Falha aqui, antes do draft,
        # em vez de publicar um pacote incompleto em silêncio.
        run: >-
          Add-Type -AssemblyName System.IO.Compression.FileSystem;
          $zip = (Resolve-Path "oficinaos-diag-v$($env:VERSION.TrimStart('v'))-win-x64.zip").Path;
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip);
          try {
            $entry = $archive.Entries | Where-Object { $_.FullName -eq 'tools/platform-tools/adb.exe' };
            if (-not $entry) { throw "Pacote incompleto: $zip não contém tools/platform-tools/adb.exe" }
            Write-Host "adb.exe confirmado no pacote: $($entry.Length) bytes"
          } finally { $archive.Dispose() }
        env:
          VERSION: ${{ github.ref_name }}

      - name: Checksum
        shell: pwsh
        # Formato: "version <x.y.z>" + "commit <sha>" + "<hash>  <filename>".
        # A assinatura cobre a versão declarada (anti-replay) e o commit que
        # gerou o build (um tag movido para outro commit depois do build é
        # recusado pelo sign-release.ps1). A release sai como DRAFT — a
        # assinatura é OFFLINE, porque uma chave no CI deixava de provar
        # origem. Ver docs/RELEASE.md.
        run: >-
          "version $($env:VERSION.TrimStart('v'))"
          | Out-File -Encoding ascii SHA256SUMS.txt;
          "commit $($env:BUILD_SHA)"
          | Out-File -Append -Encoding ascii SHA256SUMS.txt;
          "$((
          Get-FileHash "oficinaos-diag-v$($env:VERSION.TrimStart('v'))-win-x64.zip" -Algorithm SHA256
          ).Hash.ToLower())  oficinaos-diag-v$($env:VERSION.TrimStart('v'))-win-x64.zip"
          | Out-File -Append -Encoding ascii SHA256SUMS.txt
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_SHA: ${{ github.sha }}

      - name: GitHub release (draft)
        uses: softprops/action-gh-release@v3
        with:
          # Draft: invisível para releases/latest até a assinatura offline
          # publicar (sign-release.ps1 faz upload do .sig e dá publish).
          draft: true
          files: |
            oficinaos-diag-v*-win-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true

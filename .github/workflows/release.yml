name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Fetch bundled tools (adb platform-tools)
        shell: pwsh
        run: ./tools/fetch-tools.ps1

      - name: Publish single-file exe
        # The tag IS the version — embed it so the exe's self-update check
        # can never disagree with the release it's running.
        run: >-
          dotnet publish src/OficinaDiag/OficinaDiag.csproj
          -c Release -r win-x64 --self-contained true
          /p:PublishSingleFile=true
          /p:Version=$($env:VERSION.TrimStart('v')) -o out
        env:
          VERSION: ${{ github.ref_name }}

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path out/* -DestinationPath "oficinaos-diag-win-x64.zip"

      - name: Checksum
        shell: pwsh
        # The in-app updater verifies this file before extracting — a tampered
        # or partial zip must fail closed. Format: "<hash>  <filename>".
        run: >-
          "$((
          Get-FileHash oficinaos-diag-win-x64.zip -Algorithm SHA256
          ).Hash.ToLower())  oficinaos-diag-win-x64.zip"
          | Out-File -Encoding ascii SHA256SUMS.txt

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            oficinaos-diag-*.zip
            SHA256SUMS.txt
          generate_release_notes: true

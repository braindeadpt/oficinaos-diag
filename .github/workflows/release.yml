name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Fetch bundled tools (adb platform-tools)
        shell: pwsh
        run: ./tools/fetch-tools.ps1

      - name: Publish single-file exe
        run: >-
          dotnet publish src/OficinaDiag/OficinaDiag.csproj
          -c Release -r win-x64 --self-contained true
          /p:PublishSingleFile=true -o out

      - name: Package
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          Compress-Archive -Path out/* -DestinationPath "oficinaos-diag-$tag-win-x64.zip"

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: oficinaos-diag-*.zip
          generate_release_notes: true

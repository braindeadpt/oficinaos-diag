name: release

on:
  push:
    tags: ["v*"]
  # Manual: corre o mesmo caminho no mesmo runner sem criar um tag. Não
  # publica release — o passo do GitHub Release só corre em tags.
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do build manual (sem 'v', ex. 0.0.0-ci)"
        required: false
        default: "0.0.0-ci"

permissions:
  contents: write

jobs:
  build:
    # Fixo como no ci.yml: a release tem de sair do mesmo Windows em que a
    # matriz a testou, e `windows-latest` mudaria isso sem commit.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        shell: pwsh
        # Tag: a versão é o nome do tag. Manual: o input. Os passos seguintes
        # leem `$env:VERSION` daqui — num dispatch, `github.ref_name` seria o
        # nome do branch.
        run: |
          $v = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" }
          "VERSION=$($v.TrimStart('v'))" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Fetch bundled tools (adb platform-tools)
        shell: pwsh
        run: ./tools/fetch-tools.ps1

      - name: Test
        # A release não sai sem os testes verdes — enviar binários sem os
        # correr era um acidente à espera de acontecer.
        run: dotnet test tests/OficinaDiag.Tests -c Release

      - name: Publish single-file exe
        # The tag IS the version — embed it so the exe's self-update check
        # can never disagree with the release it's running.
        run: >-
          dotnet publish src/OficinaDiag/OficinaDiag.csproj
          -c Release -r win-x64 --self-contained true
          /p:PublishSingleFile=true
          /p:Version=$env:VERSION -o out

      - name: Package
        shell: pwsh
        # O nome do zip leva a versão — fica pinned no SHA256SUMS e o updater
        # valida-a contra o tag (anti-downgrade: um SUMS antigo republicado
        # num tag mais alto é recusado).
        run: >-
          Compress-Archive -Path out/*
          -DestinationPath "oficinaos-diag-v$($env:VERSION)-win-x64.zip"

      - name: Verify package contents
        shell: pwsh
        # O zip é o que o cliente recebe: sem adb o teste on-device não arranca;
        # sem models.json não há nomes de modelo; sem a página não há teste.
        # Falha aqui, antes do draft, em vez de publicar um pacote incompleto.
        # A lista vive em tools/package-files.txt (uma por linha); o
        # PackageFilesTests garante que não diverge do que os csproj publicam.
        run: >-
          $zip = "oficinaos-diag-v$($env:VERSION)-win-x64.zip";
          if (-not (Test-Path $zip)) { throw "Pacote em falta: $zip não existe" }
          if (-not (Test-Path 'tools/package-files.txt')) { throw "Lista ausente: tools/package-files.txt não existe" }
          try { Expand-Archive $zip -DestinationPath pkg-check -Force -ErrorAction Stop }
          catch { throw "Pacote ilegível: $zip não abre (corrompido ou truncado)" }
          $faltam = Get-Content 'tools/package-files.txt' | ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and -not $_.StartsWith('#') -and -not (Test-Path "pkg-check/$_") };
          if ($faltam) { throw "Pacote incompleto: falta $($faltam -join ', ') no zip" }

      - name: Checksum
        shell: pwsh
        # Formato: "version <x.y.z>" + "commit <sha>" + "<hash>  <filename>".
        # A assinatura cobre a versão declarada (anti-replay) e o commit que
        # gerou o build (um tag movido para outro commit depois do build é
        # recusado pelo sign-release.ps1). A release sai como DRAFT — a
        # assinatura é OFFLINE, porque uma chave no CI deixava de provar
        # origem. Ver docs/RELEASE.md.
        run: >-
          "version $env:VERSION"
          | Out-File -Encoding ascii SHA256SUMS.txt;
          "commit $($env:BUILD_SHA)"
          | Out-File -Append -Encoding ascii SHA256SUMS.txt;
          "$((
          Get-FileHash "oficinaos-diag-v$env:VERSION-win-x64.zip" -Algorithm SHA256
          ).Hash.ToLower())  oficinaos-diag-v$env:VERSION-win-x64.zip"
          | Out-File -Append -Encoding ascii SHA256SUMS.txt
        env:
          BUILD_SHA: ${{ github.sha }}

      - name: GitHub release (draft)
        # Num dispatch não há tag nem release: o resto do caminho corre todo.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          # Draft: invisível para releases/latest até a assinatura offline
          # publicar (sign-release.ps1 faz upload do .sig e dá publish).
          draft: true
          files: |
            oficinaos-diag-v*-win-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
